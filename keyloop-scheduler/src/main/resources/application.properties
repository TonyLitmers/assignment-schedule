spring.application.name=keyloop-scheduler

# Seed database on first run (set false to disable)
app.seed.enabled=true

# Database (matches docker-compose postgres)
spring.datasource.url=jdbc:postgresql://localhost:5433/keyloop_scheduler
spring.datasource.username=keyloop
spring.datasource.password=keyloop
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Hibernate creates/updates schema
spring.jpa.hibernate.ddl-auto=update

# Actuator - observability
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger - default paths: /swagger-ui/index.html, /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
