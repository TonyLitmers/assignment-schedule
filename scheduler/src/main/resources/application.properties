spring.application.name=scheduler

# Seed database on first run (set false to disable)
app.seed.enabled=true

# Database (Docker: postgres service name; run from project root: docker compose up --build)
spring.datasource.url=jdbc:postgresql://postgres:5432/scheduler
spring.datasource.username=scheduler
spring.datasource.password=scheduler
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - Create schema on startup, drop on shutdown (fresh DB each docker compose restart)
spring.jpa.hibernate.ddl-auto=create-drop

# Actuator - observability
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger - default paths: /swagger-ui/index.html, /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
