services:
  postgres:
    image: postgres:16-alpine
    container_name: keyloop-postgres
    environment:
      POSTGRES_DB: keyloop_scheduler
      POSTGRES_USER: keyloop
      POSTGRES_PASSWORD: keyloop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyloop -d keyloop_scheduler"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ./keyloop-scheduler
      dockerfile: Dockerfile
    container_name: keyloop-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

volumes:
  postgres_data:
